[project]
name = "kivy-garden-pyle"
version = "0.1.0"
description = "Helps create Kivy bindings in Python"
license = "MIT"
authors = [{ name = "Nattōsai Mitō", email = "flow4re2c@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"

[project.urls]
Repository = "https://github.com/gottadiveintopython/kivy-garden-pyle"

[tool.uv.build-backend]
module-name = "kivy_garden"
namespace = true

[tool.uv.sources]
kivy = { git = "https://github.com/kivy/kivy", rev = "be90b9f4bdb28c734e1cc01d6e7a7e1440e5216e" }

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "kivy",
    "pytest>=9.1.1",
]
