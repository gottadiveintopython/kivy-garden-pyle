[project]
name = "kivy-garden-pyle"
version = "0.2.1.dev0"
description = "Helps create Kivy bindings in Python"
license = "MIT"
authors = [{ name = "Nattōsai Mitō", email = "flow4re2c@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"

[project.urls]
Repository = "https://github.com/gottadiveintopython/kivy-garden-pyle"

[tool.uv.build-backend]
module-name = "kivy_garden"
namespace = true

[tool.uv.sources]
kivy = { git = "https://github.com/kivy/kivy", rev = "c8e1f5f25802924e92f4f7f41851c9669778359e" }

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "kivy",
    "pytest>=9.1.1",
]
